[project]
name = "file-janitor"
version = "0.4.0"
description = "Analyse un dossier et propose des actions de nettoyage, sans jamais rien supprimer sans confirmation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "typer>=0.27",
    "rich>=13",
    "pathspec>=1.1",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.7",
]
dev = [
    "pytest>=8",
]

[project.scripts]
janitor = "file_janitor.cli:app"
janitor-gui = "file_janitor.gui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["file_janitor*"]
